  <text x="273" y="286" font-size="11.5" fill="#5a5f66">Trenntrafo · Diff.-Tastkopf</text>

  <rect x="490" y="72" width="200" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
