document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"2eac9b97-0346-4978-90fe-0f58f75a090d\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================\n   RwTec SmartHome — Design Tokens\n   Source: unit1.pas (Lazarus/Free Pascal)\n   Colors converted from Lazarus BGR ($00BBGGRR) → CSS RGB\n   ============================================================ */\n\n/* ── Exact App Colors (from source code) ── */\n:root {\n  /* App background: $00F0F0EC → R=236,G=240,B=240 */\n  --color-bg-app:           #ECF0F0;\n  /* Card/panel white */\n  --color-bg-card:          #ffffff;\n  /* Log panel: $00F5F5F5 */\n  --color-bg-log:           #f5f5f5;\n\n  /* Nav bar background: $00333333 */\n  --color-nav-bg:           #333333;\n  /* Nav active tab: $00E8C87E → R=126,G=200,B=232 (sky blue!) */\n  --color-nav-active:       #7EC8E8;\n  /* Nav inactive: $00555555 */\n  --color-nav-inactive:     #555555;\n\n  /* Brand (from logo) */\n  --color-brand-blue:       #1a5fa8;\n  --color-brand-red:        #c0392b;\n\n  /* EIN button: $0000C000 → R=0,G=192,B=0 */\n  --color-btn-ein:          #00C000;\n  /* AUS button: $000000CC → R=204,G=0,B=0 */\n  --color-btn-aus:          #CC0000;\n  /* Duo EIN: $0000AA00 → R=0,G=170,B=0 */\n  --color-btn-ein-duo:      #00AA00;\n  /* Duo AUS: $000000AA → R=170,G=0,B=0 */\n  --color-btn-aus-duo:      #AA0000;\n\n  /* Status state panels */\n  /* State EIN: green */\n  --color-state-ein-bg:     #00C000;\n  --color-state-ein-fg:     #ffffff;\n  /* State AUS / OFF panel: $00FFC0C0 → R=192,G=192,B=255 (lavender) */\n  --color-state-aus-bg:     #C0C0FF;\n  --color-state-aus-fg:     #800000;\n\n  /* Lamp overlays */\n  /* Lamp ON: $0000BBEE → R=238,G=187,B=0 (golden yellow) */\n  --color-lamp-on:          #EEBB00;\n  /* Lamp OFF: $00444444 */\n  --color-lamp-off:         #444444;\n\n  /* Thermostat */\n  /* Setpoint marker: $00CC6600 → R=0,G=102,B=204 (blue) */\n  --color-thermo-setpoint:  #0066CC;\n  /* Heating active text: $000044BB → R=187,G=68,B=0 (dark orange) */\n  --color-thermo-active:    #BB4400;\n\n  /* Alarm */\n  /* Alarm button: $00CC4400 → R=0,G=68,B=204 (blue) */\n  --color-alarm-btn:        #0044CC;\n  /* Alarm active panel: $00CCCCFF → R=255,G=204,B=204 (light pink) */\n  --color-alarm-active-bg:  #FFCCCC;\n\n  /* Foregrounds */\n  --color-fg-primary:       #1a1a1a;\n  --color-fg-secondary:     #888888;\n  --color-fg-muted:         #666666;\n\n  /* Borders */\n  --color-border:           #C0C0C0;\n  --color-border-light:     #DDDDDD;\n\n  /* Thermostat arc gradient */\n  --color-thermo-cold:      #0000C8;   /* blue */\n  --color-thermo-cool:      #00B400;   /* green */\n  --color-thermo-warm:      #DCB400;   /* orange-yellow */\n  --color-thermo-hot:       #DC0000;   /* red */\n\n  /* Connection status */\n  --color-connected-bg:     #f0fdf4;\n  --color-connected-border: #22c55e;\n  --color-connected-text:   #15803d;\n  --color-connected-dot:    #22c55e;\n  --color-disconnected-dot: #f59e0b;\n\n  /* Slider thumb */\n  --color-slider-thumb:     #2563eb;\n}\n\n/* ── Typography ── */\n:root {\n  --font-family:            \"Segoe UI\", system-ui, -apple-system, sans-serif;\n  --font-family-mono:       \"Consolas\", \"Courier New\", monospace;\n\n  /* Scale (from source: MakeLabel font sizes) */\n  --font-size-xs:           8px;    /* timestamp */\n  --font-size-sm:           9px;    /* subtitle, label */\n  --font-size-base:         10px;   /* state badge */\n  --font-size-md:           11px;   /* card title */\n  --font-size-lg:           13px;   /* caption title */\n  --font-size-xl:           14px;   /* data value */\n  --font-size-2xl:          20px;   /* thermostat temp */\n\n  --font-weight-regular:    400;\n  --font-weight-bold:       700;\n  --line-height-tight:      1.2;\n  --line-height-normal:     1.4;\n}\n\n/* ── Semantic Typography ── */\n:root {\n  --h1-size:     13px;   /* 'SmartHome-Steuerung' title */\n  --h1-weight:   700;\n  --h2-size:     11px;   /* card titles */\n  --h2-weight:   700;\n  --label-size:  9px;\n  --label-color: #888888;\n  --value-size:  14px;\n  --value-weight: 700;\n  --mono-size:   8px;\n  --mono-family: var(--font-family-mono);\n}\n\n/* ── Layout Constants (from source) ── */\n:root {\n  --card-w:      230px;\n  --card-h:      330px;\n  --card-gap:    12px;\n  --nav-h:       48px;\n  --top-bar-h:   48px;\n}\n\n/* ── Spacing ── */\n:root {\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-6:  24px;\n  --space-8:  32px;\n}\n\n/* ── Border Radius ── */\n:root {\n  --radius-sm:    4px;\n  --radius-full:  9999px;\n}\n\n/* ── Shadows ── */\n:root {\n  /* Card shadow: simulated via PaintCardPanel (right+bottom pixel stripes) */\n  --shadow-card:  2px 2px 5px rgba(0,0,0,0.18);\n  --shadow-none:  none;\n}\n\n.rw-font { font-family: var(--font-family); }\n.rw-mono  { font-family: var(--font-family-mono); }\n<\u002Fstyle>\n<script src=\"2d00ae4d-12c3-4af0-b815-e7b4695c12c4\"><\u002Fscript>\n<style>\n  doc-page:not(:defined){visibility:hidden}\n  html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }\n  body{ margin:0; font-family:\"Segoe UI\", system-ui, -apple-system, sans-serif; color:#1a1a1a; }\n  a{ color:#0066CC; text-decoration:none; }\n  a:hover{ text-decoration:underline; }\n  .heft h2{ break-after:avoid; }\n  .heft h3{ break-after:avoid; }\n  .heft table{ break-inside:auto; }\n  .heft tr{ break-inside:avoid; }\n  .callout{ break-inside:avoid; }\n  .kicker{ break-inside:avoid; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"doc-page\" from=\"806172d4-65ac-4710-99bb-4326970f9125#/doc-page.js\" size=\"a4\" margin=\"0.7in\" hint-size=\"100%,100%\">\n\n  <div slot=\"header\" style=\"display:flex; align-items:center; justify-content:space-between; font-size:9.5px; letter-spacing:.06em; color:#888; text-transform:uppercase; padding-bottom:5px; border-bottom:1px solid #C0C0C0;\">\n    <span style=\"font-weight:700; color:#333;\">RwTec · Werkstattbericht<\u002Fspan>\n    <span>12-V-Sperrwandler · OB2263<\u002Fspan>\n  <\u002Fdiv>\n\n  <div slot=\"footer\" style=\"display:flex; align-items:center; justify-content:space-between; font-size:9px; color:#999; padding-top:5px; border-top:1px solid #C0C0C0;\">\n    <span>Erstellt 2026-07-11 · OB2263-Sperrwandler<\u002Fspan>\n    <span>RwTec<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"heft\">\n\n  <!-- ===================== COVER (Seite 1) ===================== -->\n  <div style=\"min-height:9.6in; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 12px;\">\n    <img src=\"13c82138-30c3-4563-999d-892175b68c24\" alt=\"RwTec Logo\" style=\"width:120px; height:120px; margin-bottom:34px;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:#0066CC; margin-bottom:18px;\">RwTec · Werkstattbericht<\u002Fdiv>\n    <h1 style=\"font-size:64px; line-height:1.02; font-weight:800; margin:0 0 18px; letter-spacing:-0.02em;\">Netzteil<br>Verstehen<\u002Fh1>\n    <div style=\"width:80px; height:5px; background:#7EC8E8; margin:6px 0 22px;\"><\u002Fdiv>\n    <p style=\"font-size:17px; line-height:1.5; color:#555; margin:0 0 4px; max-width:34ch;\">Ein 12-V-Schaltnetzteil verstehen, prüfen&nbsp;&amp; simulieren<\u002Fp>\n    <p style=\"font-size:14px; color:#888; margin:2px 0 0;\">Isolierter Sperrwandler mit OB2263, Optokoppler &amp; TL431<\u002Fp>\n    <div style=\"margin-top:auto; padding-top:60px;\">\n      <div style=\"font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#999; margin-bottom:6px;\">Verfasser<\u002Fdiv>\n      <p style=\"margin:0; font-size:15px; font-weight:700; color:#333;\">Reinhard Wermeling &amp; KI-Claude<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== INNENSEITE COVER (Seite 2) ===================== -->\n  <div style=\"break-before:page;\"><\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; justify-content:center; min-height:9.6in;\">\n    <div class=\"kicker\" style=\"font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#888; margin-bottom:16px;\">Das Objekt<\u002Fdiv>\n    <figure class=\"callout\" style=\"margin:0 0 30px;\">\n      <img src=\"6b70bbb4-7405-48d7-9359-064158afcd61\" alt=\"Platine — 12V SMPS Board\" style=\"width:100%; height:auto; border:1px solid #C0C0C0; border-radius:4px; display:block;\">\n      <figcaption style=\"font-size:12px; color:#666; margin-top:8px; line-height:1.5;\"><b>Abb. 1 · Platine.<\u002Fb> 3D-Ansicht der 12-V-Schaltnetzteil-Baugruppe: Netzeingang (AC IN) links, Zwischenkreis-Elko, Sperrwandler-Trafo (EE16) in der Mitte, Ausgang (+12&nbsp;V OUT) rechts.<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure class=\"callout\" style=\"margin:0;\">\n      <img src=\"8154a48a-3589-40c3-9fd5-f4b5c3d10a7e\" alt=\"Schaltplan — Circuit Diagram\" style=\"width:100%; height:auto; border:1px solid #C0C0C0; border-radius:4px; display:block;\">\n      <figcaption style=\"font-size:12px; color:#666; margin-top:8px; line-height:1.5;\"><b>Abb. 2 · Schaltplan.<\u002Fb> Das komplette Schaltbild — von F1/NTC über BR1, C2 und den OB2263 (U1) mit Q1, bis zur sekundären Gleichrichtung (D2, C6) und der Regelung aus TL431 (U3) und Optokoppler PC817 (U2).<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <!-- ===================== TITLE (Seite 3) ===================== -->\n  <div style=\"break-before:page; border-top:6px solid #333; padding-top:18px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#0066CC; margin-bottom:14px;\">\n      <span style=\"width:9px; height:9px; background:#7EC8E8; border:1px solid #4a9fc4; display:inline-block;\"><\u002Fspan>\n      Netzgerät-Dokumentation · Gesamtheft\n    <\u002Fdiv>\n    <h1 style=\"font-size:38px; line-height:1.1; font-weight:800; margin:0 0 12px; letter-spacing:-0.01em;\">Ein 12-V-Schaltnetzteil verstehen, prüfen&nbsp;&amp; simulieren<\u002Fh1>\n    <p style=\"font-size:15px; line-height:1.5; color:#555; margin:0 0 4px; max-width:52ch;\">Wie aus 230&nbsp;V Netzspannung geregelte, berührsichere 12&nbsp;V werden — ein isolierter Sperrwandler mit OB2263, Optokoppler und TL431.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- Kurzfassung callout -->\n  <div class=\"callout\" style=\"margin-top:22px; background:#fff; border:1px solid #C0C0C0; border-left:5px solid #7EC8E8; border-radius:4px; padding:16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.08);\">\n    <div style=\"font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#4a9fc4; margin-bottom:6px;\">Kurzfassung<\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.6; color:#333;\">Die Schaltung ist ein <b>isolierter Sperrwandler<\u002Fb> (Flyback) mit rund 12&nbsp;V Ausgang und etwa 10–15&nbsp;W. Ein PWM-Controller <b>OB2263<\u002Fb> taktet einen MOSFET mit ~65&nbsp;kHz; ein kleiner Trafo (EE16) speichert die Energie häppchenweise und trennt die gefährliche Netzseite von der sicheren 12-V-Seite. Geregelt wird sekundärseitig mit einem <b>TL431<\u002Fb>, isoliert über einen Optokoppler <b>PC817<\u002Fb> an den Controller zurückgemeldet. Dieses Heft bündelt alles in drei Schritten: <b>Verstehen&nbsp;→ Prüfen&nbsp;→ Simulieren<\u002Fb>.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- Inhaltsverzeichnis -->\n  <div style=\"margin-top:26px;\">\n    <div class=\"kicker\" style=\"font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#888; margin-bottom:10px;\">Inhalt<\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:8px 22px;\">\n      <div style=\"display:flex; gap:10px; align-items:baseline;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:15px; min-width:22px;\">01<\u002Fspan><span style=\"font-size:13px; color:#333;\"><b>Verstehen<\u002Fb> — Funktionsanalyse der Schaltung<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px; align-items:baseline;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:15px; min-width:22px;\">02<\u002Fspan><span style=\"font-size:13px; color:#333;\"><b>Prüfen<\u002Fb> — Mess- &amp; Fehleranalyse (sicher)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px; align-items:baseline;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:15px; min-width:22px;\">03<\u002Fspan><span style=\"font-size:13px; color:#333;\"><b>Simulieren<\u002Fb> — Nachbau im Falstad-Browser<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px; align-items:baseline;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:15px; min-width:22px;\">04<\u002Fspan><span style=\"font-size:13px; color:#333;\"><b>Referenz<\u002Fb> — Bauteilliste &amp; Kernaussagen<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== TEIL 1 ===================== -->\n  <div style=\"break-before:page;\"><\u002Fdiv>\n  <div style=\"display:flex; align-items:center; gap:14px; margin-top:6px; padding-bottom:8px; border-bottom:2px solid #333;\">\n    <span style=\"font-size:40px; font-weight:800; color:#7EC8E8; line-height:1;\">01<\u002Fspan>\n    <div>\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#888;\">Teil 1 · Verstehen<\u002Fdiv>\n      <h2 style=\"font-size:24px; font-weight:800; margin:2px 0 0;\">Wie das Netzteil arbeitet<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:20px 0 6px; color:#1a1a1a;\">Ausgangslage &amp; Topologie<\u002Fh3>\n  <p style=\"font-size:13.5px; line-height:1.65; margin:0 0 10px; color:#333;\">Vor uns liegt ein kompaktes Netzteil, das aus dem 230-V-Wechselstromnetz stabile 12&nbsp;V Gleichspannung macht — ein primärgetaktetes Schaltnetzteil. Kein schwerer 50-Hz-Trafo, sondern ein winziger Hochfrequenz-Trafo (Kern EE16), betrieben mit rund 65&nbsp;kHz. Das macht das Ganze klein, leicht und effizient.<\u002Fp>\n  <p style=\"font-size:13.5px; line-height:1.65; margin:0 0 12px; color:#333;\">Das Funktionsprinzip heißt <b>Sperrwandler<\u002Fb> (flyback): Der MOSFET zerhackt die Gleichspannung in schnelle Impulse. In der Einschaltphase wird Energie im Trafo gespeichert, in der Ausschaltphase an den Ausgang „ausgeworfen\". Primär- und Sekundärseite leiten dabei nie gleichzeitig.<\u002Fp>\n\n  <div class=\"callout\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:6px 0 16px;\">\n    <div style=\"background:#fff; border:1px solid #C0C0C0; border-top:4px solid #CC0000; border-radius:4px; padding:12px 14px;\">\n      <div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#CC0000; margin-bottom:4px;\">Primärseite<\u002Fdiv>\n      <p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#444;\">Direkt am Netz, führt lebensgefährliche <b>~325&nbsp;V<\u002Fb> Gleichspannung.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff; border:1px solid #C0C0C0; border-top:4px solid #00C000; border-radius:4px; padding:12px 14px;\">\n      <div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#00902f; margin-bottom:4px;\">Sekundärseite<\u002Fdiv>\n      <p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#444;\">Berührsichere <b>12&nbsp;V<\u002Fb> für den Verbraucher.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:13.5px; line-height:1.65; margin:0 0 12px; color:#333;\">Verbunden sind beide Welten nur über zwei Bauteile: den <b>Trafo<\u002Fb> (überträgt Energie) und den <b>Optokoppler<\u002Fb> (überträgt Information). Genau diese galvanische Trennung ist das Sicherheitsherz der Schaltung.<\u002Fp>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:20px 0 8px;\">Signalfluss — Block für Block<\u002Fh3>\n  <ol style=\"margin:0 0 14px; padding-left:20px; font-size:13px; line-height:1.7; color:#333;\">\n    <li style=\"margin-bottom:5px;\"><b>Netzeingang &amp; Schutz<\u002Fb> — F1 (3&nbsp;A) Sicherung, NTC als Einschaltstrombegrenzer, C1 (4,7&nbsp;µF/400&nbsp;V) Entstörung.<\u002Fli>\n    <li style=\"margin-bottom:5px;\"><b>Gleichrichtung &amp; Sieben<\u002Fb> — BR1 (4&nbsp;A/600&nbsp;V) Brücke, C2 (47&nbsp;µF/400&nbsp;V) glättet auf die <span style=\"background:#fff3cd; padding:0 3px;\">~325&nbsp;V Zwischenkreisspannung<\u002Fspan>.<\u002Fli>\n    <li style=\"margin-bottom:5px;\"><b>Anlauf &amp; Versorgung<\u002Fb> — R1 (100&nbsp;k) lädt VCC bis zur UVLO-Schwelle, C3 (10&nbsp;µF) stützt; nach dem Anlauf versorgt eine Hilfswicklung (mit D1) den Controller dauerhaft.<\u002Fli>\n    <li style=\"margin-bottom:5px;\"><b>Schaltstufe<\u002Fb> — Q1 (7N65) Leistungs-MOSFET, T1 (EE16) Speichertrafo, R2 (10&nbsp;Ω) Strom-Messwiderstand.<\u002Fli>\n    <li><b>Sekundär-Gleichrichtung<\u002Fb> — D2 (SR540) Schottky-Diode, C6 (2200&nbsp;µF/25&nbsp;V) Ausgangs-Elko glättet auf saubere 12&nbsp;V.<\u002Fli>\n  <\u002Fol>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:20px 0 6px;\">Herzstück: Die Regelung (OB2263 + Opto + TL431)<\u002Fh3>\n  <p style=\"font-size:13.5px; line-height:1.65; margin:0 0 10px; color:#333;\">Der OB2263 ist ein <b>Strommodus-PWM-Controller<\u002Fb>: Er regelt nicht direkt die Spannung, sondern in jedem einzelnen Takt den Spitzenstrom durch den MOSFET. Daraus ergeben sich zwei ineinander verschachtelte Regelschleifen.<\u002Fp>\n  <div class=\"callout\" style=\"background:#f5f8fa; border:1px solid #d5e2ea; border-radius:4px; padding:13px 16px; margin:0 0 12px;\">\n    <p style=\"margin:0 0 6px; font-size:12.5px; line-height:1.6; color:#333;\"><b style=\"color:#0066CC;\">Innere, schnelle Schleife (Strom, CS/R2):<\u002Fb> Steigt der Strom rampenförmig an, bildet R2 ihn als Spannung am CS-Pin ab. Erreicht diese die vom FB-Pin vorgegebene Schwelle, schaltet der OB2263 den MOSFET <b>Takt für Takt sofort ab<\u002Fb>. Überstromschutz ist damit praktisch geschenkt.<\u002Fp>\n    <p style=\"margin:0; font-size:12.5px; line-height:1.6; color:#333;\"><b style=\"color:#0066CC;\">Äußere, langsame Schleife (Spannung, Opto):<\u002Fb> Der TL431 vergleicht über den Teiler R8/R9 die Ausgangsspannung mit seiner 2,5-V-Referenz und steuert die PC817-LED. Der Fototransistor sitzt primärseitig am FB-Pin — die einzige Signalbrücke über die Trennstelle.<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"font-size:12.5px; line-height:1.7; margin:0 0 10px; color:#444; padding:10px 14px; background:#fff; border:1px solid #C0C0C0; border-radius:4px;\"><b>Wirkungskette (Gegenkopplung):<\u002Fb> U<sub>out<\u002Fsub>&nbsp;↑ → Teiler hebt REF über 2,5&nbsp;V → TL431 zieht mehr Strom → PC817-LED heller → FB-Pin wird heruntergezogen → OB2263 senkt die Stromschwelle → Q1 schaltet früher ab → weniger Energie pro Takt → U<sub>out<\u002Fsub> sinkt wieder.<\u002Fp>\n  <p style=\"font-size:13px; line-height:1.6; margin:0 0 8px; color:#333;\"><b>Sollwert-Formel (TL431):<\u002Fb> &nbsp; U<sub>out<\u002Fsub> = 2,5&nbsp;V × (1 + R<sub>oben<\u002Fsub>/R<sub>unten<\u002Fsub>).<\u002Fp>\n  <p style=\"font-size:11.5px; line-height:1.55; margin:0 0 4px; color:#8a5a00; background:#fff3cd; border:1px solid #f0d98a; border-radius:4px; padding:9px 12px;\"><b>⚠ Hinweis:<\u002Fb> Mit den angeschriebenen Werten R8&nbsp;=&nbsp;2,2&nbsp;k / R9&nbsp;=&nbsp;1&nbsp;k käme rechnerisch ~8&nbsp;V heraus, nicht 12&nbsp;V. Für echte 12&nbsp;V braucht man R<sub>oben<\u002Fsub>/R<sub>unten<\u002Fsub>&nbsp;≈&nbsp;3,8. Solche „Circuit-Diagram\"-Werte sind nicht als exakt zu nehmen.<\u002Fp>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:22px 0 6px;\">Der Sperrwandler-Trafo als Energiespeicher<\u002Fh3>\n  <p style=\"font-size:13.5px; line-height:1.65; margin:0 0 10px; color:#333;\">T1 ist gar kein „Trafo\" im klassischen Sinn, sondern eine <b>gekoppelte Speicherdrossel<\u002Fb>, die im Zweitakt arbeitet:<\u002Fp>\n  <div style=\"display:flex; gap:12px; margin:0 0 12px;\">\n    <div style=\"flex:1; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:12px 14px;\">\n      <div style=\"font-size:12px; font-weight:700; color:#1a1a1a; margin-bottom:3px;\">① Speichern (Q1 leitet)<\u002Fdiv>\n      <p style=\"margin:0; font-size:12px; line-height:1.55; color:#555;\">Primärstrom steigt rampenförmig, Feldenergie lädt sich auf (E&nbsp;=&nbsp;½&nbsp;L&nbsp;i²). D2 sperrt — noch fließt nichts zum Ausgang.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:12px 14px;\">\n      <div style=\"font-size:12px; font-weight:700; color:#1a1a1a; margin-bottom:3px;\">② Abgeben (Q1 sperrt)<\u002Fdiv>\n      <p style=\"margin:0; font-size:12px; line-height:1.55; color:#555;\">Strom bricht ab, Spannung kehrt sich um, D2 leitet — die gespeicherte Energie wird an C6/Ausgang „ausgeworfen\" (fly-back).<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:12.5px; line-height:1.6; margin:0 0 14px; color:#444;\"><b>Warum der Luftspalt entscheidend ist:<\u002Fb> Im kleinen Luftspalt des EE16-Kerns steckt der Löwenanteil der Energie. Ohne Spalt ginge das Ferrit schon bei kleinem Strom in Sättigung und der MOSFET brennt durch. Ein reiner Trafo will keinen Spalt — ein Flyback-Trafo braucht ihn.<\u002Fp>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:20px 0 6px;\">Optokoppler PC817 &amp; MOSFET 7N65<\u002Fh3>\n  <p style=\"font-size:13px; line-height:1.6; margin:0 0 8px; color:#333;\"><b>PC817:<\u002Fb> LED und Fototransistor in einem Gehäuse, die sich nur mit Licht verständigen — keine elektrische Verbindung (spannungsfest bis ~5000&nbsp;V). Kennwert ist das CTR: I<sub>C<\u002Fsub>&nbsp;=&nbsp;CTR&nbsp;×&nbsp;I<sub>LED<\u002Fsub> (~50–600&nbsp;%). Er arbeitet hier analog im linearen Bereich und überträgt einen stufenlosen Fehlerpegel.<\u002Fp>\n  <p style=\"font-size:13px; line-height:1.6; margin:0 0 10px; color:#333;\"><b>7N65:<\u002Fb> 650-V-/~7-A-N-Kanal-MOSFET, das schnell schaltende Ventil. 650&nbsp;V braucht es, weil am Drain in der Ausschaltphase U<sub>Bus<\u002Fsub> (~325&nbsp;V) + reflektierte Spannung + Leck-Spitze zusammenkommen (450–550&nbsp;V). Q1 vereint drei Rollen: Leistungsschalter, Stellglied der Regelung und Strom-Messpunkt.<\u002Fp>\n  <p style=\"font-size:12.5px; line-height:1.6; margin:0 0 14px; color:#444; padding:10px 14px; background:#f5f8fa; border-left:4px solid #7EC8E8; border-radius:0 4px 4px 0;\"><b>Merksatz:<\u002Fb> Der Trafo überträgt die Energie isoliert, der Optokoppler überträgt die Information isoliert. Zusammen schließen sie den Regelkreis über die Sicherheitsgrenze hinweg.<\u002Fp>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:18px 0 6px;\">Schutzfunktionen (im OB2263 integriert)<\u002Fh3>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; font-size:12.5px; line-height:1.5; color:#333; margin-bottom:6px;\">\n    <div>✓&nbsp; UVLO — Unterspannungssperre<\u002Fdiv>\n    <div>✓&nbsp; Zyklischer Überstromschutz (CS/R2)<\u002Fdiv>\n    <div>✓&nbsp; Überlast/Kurzschluss → Hiccup/Auto-Restart<\u002Fdiv>\n    <div>✓&nbsp; Übertemperatur &amp; teils Überspannung<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== TEIL 2 ===================== -->\n  <div style=\"break-before:page;\"><\u002Fdiv>\n  <div style=\"display:flex; align-items:center; gap:14px; margin-top:6px; padding-bottom:8px; border-bottom:2px solid #333;\">\n    <span style=\"font-size:40px; font-weight:800; color:#7EC8E8; line-height:1;\">02<\u002Fspan>\n    <div>\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#888;\">Teil 2 · Prüfen<\u002Fdiv>\n      <h2 style=\"font-size:24px; font-weight:800; margin:2px 0 0;\">Fehler sicher finden<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"callout\" style=\"margin-top:18px; background:#ffecec; border:1px solid #f0b8b8; border-left:5px solid #CC0000; border-radius:4px; padding:15px 18px;\">\n    <div style=\"font-size:12px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#CC0000; margin-bottom:7px;\">⚠ Lebensgefahr — Sicherheit zuerst<\u002Fdiv>\n    <ul style=\"margin:0; padding-left:18px; font-size:12.5px; line-height:1.6; color:#3a1a1a;\">\n      <li style=\"margin-bottom:4px;\"><b>Primärseite = Netzpotential (~325&nbsp;V).<\u002Fb> Die primäre „Masse\" ist <u>nicht<\u002Fu> Schutzerde.<\u002Fli>\n      <li style=\"margin-bottom:4px;\">Niemals die Masseklemme eines geerdeten Oszilloskops an die Primärseite klemmen → Kurzschluss über den Schutzleiter, Lichtbogen.<\u002Fli>\n      <li style=\"margin-bottom:4px;\"><b>Trenntransformator<\u002Fb> ist Pflicht für alle Arbeiten unter Spannung; <b>Differenztastkopf<\u002Fb> für jede primärseitige Scope-Messung.<\u002Fli>\n      <li style=\"margin-bottom:4px;\">C2 (47&nbsp;µF) vor jeder Arbeit über ~10&nbsp;kΩ/5&nbsp;W entladen, dann auf &lt;&nbsp;30&nbsp;V prüfen.<\u002Fli>\n      <li>Erst-Einschalten über Reihen-Glühlampe („Dim-Bulb-Tester\"). Einhand-Regel, isoliertes Werkzeug, nie allein arbeiten.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:22px 0 8px; color:#00902f;\">Teil A · Statische Prüfung <span style=\"font-weight:400; color:#888; font-size:13px;\">(spannungsfrei, C2 entladen)<\u002Fspan><\u002Fh3>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:16px;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"background:#333; color:#fff;\">\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Prüfling<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Messung<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Sollwert<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Abweichung bedeutet<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">F1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Durchgang<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">~0&nbsp;Ω<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">unterbrochen → Folgefehler (oft Q1/BR1-Kurzschluss)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">BR1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">4 Dioden<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">~0,4–0,6&nbsp;V vorwärts, sperrt rückwärts<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Kurzschluss → Ursache für durchgebrannte F1<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">Q1 (7N65)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">D–S, G–S, G–D<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">D–S sperrt, G isoliert<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\"><b>D–S niederohmig = MOSFET durchlegiert<\u002Fb> (klassisch)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">R2<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Widerstand<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">10&nbsp;Ω<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">offen → kein CS-Signal, Q1 ungeschützt<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">R1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Widerstand<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">100&nbsp;kΩ<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">offen → kein Anlauf (keine VCC)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">D1 / D2<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Diodentest<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">~0,6&nbsp;V / ~0,3&nbsp;V (D2 Schottky)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">D2 kurz → Ausgang tot / Hiccup<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">C2 / C6 / C3<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Sicht + ESR<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">keine Wölbung, niedriger ESR<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">aufgebläht/hoher ESR → Ripple, Anlaufprobleme<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">PC817-LED<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Diodentest (Pin 1–2)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">~1,0–1,2&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">offen → Regelkreis unterbrochen → Überspannung<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; font-weight:700;\">R8 / R9<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">Widerstand<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">2,2&nbsp;kΩ / 1&nbsp;kΩ<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">Drift → falsche Ausgangsspannung<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:20px 0 8px; color:#BB4400;\">Teil B · Messungen unter Spannung <span style=\"font-weight:400; color:#888; font-size:13px;\">(Trenntrafo + Differenztastkopf!)<\u002Fspan><\u002Fh3>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:12px;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"background:#333; color:#fff;\">\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Messpunkt<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Gerät<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Sollwert<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Abweichung bedeutet<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">C2 (Zwischenkreis)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">DMM DC, Primärmasse<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">~300–325&nbsp;V DC<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">zu niedrig → Eingang, BR1, NTC, C2, Kurzschluss<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">VCC am OB2263<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Scope, Primärmasse<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">steigt auf ~16&nbsp;V, dann stabil<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\"><b>sägezahn 2–16&nbsp;V = Hiccup<\u002Fb> → Überlast/offener Kreis<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">Gate von Q1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Differenztastkopf<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Rechteck ~65&nbsp;kHz, 10–18&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">kein Signal → Controller startet nicht (VCC/UVLO)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">Drain von Q1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Differenztastkopf<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Schaltflanken + Spike<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\"><b>Spitze &gt; 650&nbsp;V<\u002Fb> → Snubber fehlt/defekt, Q1 gefährdet<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">CS-Pin (an R2)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Differenztastkopf<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Sägezahn, Spitze ~0,5–1&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">flach/0 → R2 offen; ständig am Limit → Überlast<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">FB-Pin<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Differenztastkopf<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">DC ~1–3&nbsp;V im Betrieb<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">~0,75&nbsp;V = Duty→0; dauerhaft hoch = offener Kreis<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">+12&nbsp;V Ausgang<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">DMM+Scope, Sekundärmasse<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">12&nbsp;V ±5&nbsp;%, Ripple &lt;~100&nbsp;mVpp<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">zu niedrig → Regelkreis/Last/C6; zu hoch → Kreis offen<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; font-weight:700;\">TL431 REF<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">DMM, Sekundärmasse<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">~2,5&nbsp;V bei Regelung<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">≠&nbsp;2,5&nbsp;V → TL431 oder Teiler R8/R9 defekt<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font-size:11.5px; line-height:1.55; margin:0 0 16px; color:#444; padding:9px 12px; background:#f5f8fa; border-left:4px solid #7EC8E8; border-radius:0 4px 4px 0;\"><b>Massebezug:<\u002Fb> Sekundärmessungen (Ausgang, TL431) referenzieren die sichere, isolierte Sekundärmasse — normaler Tastkopf genügt. Primärmessungen (C2, VCC, Gate, Drain, CS, FB) referenzieren die netzbezogene Primärmasse — nur mit Differenztastkopf.<\u002Fp>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:20px 0 8px;\">Symptom → Ursache (Schnelldiagnose)<\u002Fh3>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:8px;\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"background:#333; color:#fff;\">\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Symptom<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Wahrscheinliche Ursachen<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; padding:7px 9px; font-weight:700;\">Zuerst prüfen<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">Völlig tot, keine VCC<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">F1 offen, BR1/Q1 kurz, C2 defekt, R1 offen, OB2263 defekt<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Teil A + C2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">Tickt/pfeift, Ausgang bricht ein (Hiccup)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Überlast/Kurzschluss sekundär, D2 kurz, C6 kurz, offener Regelkreis<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">VCC-Verlauf, D2, Opto<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">Ausgang zu hoch<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">Regelkreis offen: PC817-LED, TL431, R8/R9<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px; border-bottom:1px solid #d8dde2;\">FB-Pin, Opto, TL431<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:6px 9px; font-weight:700;\">Ausgang zu niedrig / bricht unter Last ein<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">C2-ESR, C6-ESR, D2, schwache Regelung<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 9px;\">ESR C2/C6, D2<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <!-- ===================== TEIL 3 ===================== -->\n  <div style=\"break-before:page;\"><\u002Fdiv>\n  <div style=\"display:flex; align-items:center; gap:14px; margin-top:6px; padding-bottom:8px; border-bottom:2px solid #333;\">\n    <span style=\"font-size:40px; font-weight:800; color:#7EC8E8; line-height:1;\">03<\u002Fspan>\n    <div>\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#888;\">Teil 3 · Simulieren<\u002Fdiv>\n      <h2 style=\"font-size:24px; font-weight:800; margin:2px 0 0;\">Nachbau im Falstad-Browser<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"font-size:13.5px; line-height:1.65; margin:18px 0 10px; color:#333;\">Mit dem kostenlosen <b>Falstad CircuitJS<\u002Fb> (<a href=\"https://falstad.com/circuit\">falstad.com/circuit<\u002Fa>, keine Installation) lässt sich das Prinzip anschaulich nachbauen: Zwischenkreis → Schalter → Trafo → Gleichrichtung → geschlossener Regelkreis. Den OB2263 ersetzen wir durch Sägezahn + Komparator (PWM) und einen Op-Amp (Fehlerverstärker) — gleiche Wirkung. Der animierte Stromfluss macht Gleichrichtung, Trafo und Rückkopplung sichtbar.<\u002Fp>\n\n  <div class=\"callout\" style=\"background:#fff3cd; border:1px solid #f0d98a; border-radius:4px; padding:12px 16px; margin:0 0 16px;\">\n    <div style=\"font-size:12px; font-weight:700; color:#8a5a00; margin-bottom:4px;\">⚙ Vorbereitung — wichtig!<\u002Fdiv>\n    <p style=\"margin:0; font-size:12.5px; line-height:1.6; color:#4a3a10;\">Ein SNT taktet mit ~65&nbsp;kHz. Damit Falstad sauber rechnet: <b>Options → Other Options → Time step size auf ~1e-7 … 2e-7&nbsp;s<\u002Fb> stellen (Standard 5e-6 ist viel zu grob). Danach <i>Simulation Speed<\u002Fi> langsam stellen, um die Vorgänge zu beobachten.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:16px 0 10px;\">Der Aufbau in 7 Schritten<\u002Fh3>\n  <div style=\"display:flex; flex-direction:column; gap:8px; margin-bottom:16px;\">\n    <div class=\"callout\" style=\"display:flex; gap:12px; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:10px 14px;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:18px; min-width:24px;\">①<\u002Fspan><p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#333;\"><b>Zwischenkreis (~310&nbsp;V):<\u002Fb> Draw&nbsp;→&nbsp;Inputs and Sources&nbsp;→&nbsp;<i>Add Var Rail<\u002Fi>, Wert 310&nbsp;V (später dein „Netzspannungs\"-Regler). <i>Add Ground<\u002Fi> als Bezugsmasse.<\u002Fp><\u002Fdiv>\n    <div class=\"callout\" style=\"display:flex; gap:12px; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:10px 14px;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:18px; min-width:24px;\">②<\u002Fspan><p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#333;\"><b>Sperrwandler-Trafo:<\u002Fb> <i>Add Transformer<\u002Fi>. Edit: Primary Inductance ≈ 2,5&nbsp;mH, Turns Ratio (Np:Ns) ≈ 8, Coupling 0,99. Primär-oben an +310&nbsp;V.<\u002Fp><\u002Fdiv>\n    <div class=\"callout\" style=\"display:flex; gap:12px; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:10px 14px;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:18px; min-width:24px;\">③<\u002Fspan><p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#333;\"><b>Schalttransistor (statt Q1):<\u002Fb> <i>Add MOSFET (N-Channel)<\u002Fi>. Drain an Primär-unten, Source an Masse, Gate kommt vom PWM (Schritt&nbsp;⑤).<\u002Fp><\u002Fdiv>\n    <div class=\"callout\" style=\"display:flex; gap:12px; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:10px 14px;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:18px; min-width:24px;\">④<\u002Fspan><p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#333;\"><b>Sekundär-Gleichrichtung:<\u002Fb> Diode von Sekundärwicklung zum Ausgang (+12&nbsp;V), Capacitor 220&nbsp;µF, Resistor 12&nbsp;Ω als Grundlast (~1&nbsp;A). Optional Switch + zweiter Lastwiderstand für den Lastsprung.<\u002Fp><\u002Fdiv>\n    <div class=\"callout\" style=\"display:flex; gap:12px; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:10px 14px;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:18px; min-width:24px;\">⑤<\u002Fspan><p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#333;\"><b>PWM erzeugen:<\u002Fb> A/C Voltage Source → Waveform Sawtooth, 65&nbsp;kHz, 0…5&nbsp;V. Op-Amp als Komparator: −&nbsp;=&nbsp;Sägezahn, +&nbsp;=&nbsp;Regelspannung, Ausgang → Gate. Regelspannung hoch&nbsp;⇒&nbsp;Tastverhältnis groß.<\u002Fp><\u002Fdiv>\n    <div class=\"callout\" style=\"display:flex; gap:12px; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:10px 14px;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:18px; min-width:24px;\">⑥<\u002Fspan><p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#333;\"><b>Rückkopplung (statt TL431+Opto):<\u002Fb> Teiler R8=38&nbsp;k / R9=10&nbsp;k (Mittelabgriff = Istwert), Referenz 2,5&nbsp;V (Var Rail). Op-Amp als Fehlerverstärker: −&nbsp;=&nbsp;Istwert, +&nbsp;=&nbsp;2,5&nbsp;V, Ausgang = Regelspannung. RC-Glied (100&nbsp;k + 1&nbsp;nF) für Stabilität (PI-Regler).<\u002Fp><\u002Fdiv>\n    <div class=\"callout\" style=\"display:flex; gap:12px; background:#fff; border:1px solid #C0C0C0; border-radius:4px; padding:10px 14px;\"><span style=\"font-weight:800; color:#7EC8E8; font-size:18px; min-width:24px;\">⑦<\u002Fspan><p style=\"margin:0; font-size:12.5px; line-height:1.55; color:#333;\"><b>Messen &amp; Ausprobieren:<\u002Fb> View in Scope auf Ausgang, Gate, Primärstrom. Last ändern → U<sub>out<\u002Fsub> bleibt ~12&nbsp;V. Var Rail schieben → U<sub>out<\u002Fsub> stabil, Duty ändert sich. Regelung „öffnen\" → U<sub>out<\u002Fsub> läuft in die Überspannung.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid; grid-template-columns:1.05fr .95fr; gap:16px; margin-bottom:8px;\">\n    <div>\n      <h3 style=\"font-size:15px; font-weight:700; margin:6px 0 6px;\">Bauteil-/Wertetabelle<\u002Fh3>\n      <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:11px;\">\n        <sc-raw-thead><sc-raw-tr style=\"background:#333; color:#fff;\"><sc-raw-th style=\"text-align:left; padding:5px 8px;\">Falstad<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left; padding:5px 8px;\">Wert<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left; padding:5px 8px;\">Rolle<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Var Rail<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">310&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">C2 (~325&nbsp;V)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Transformer<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">2,5&nbsp;mH · n&nbsp;8 · k&nbsp;0,99<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">T1 (EE16)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">MOSFET (N)<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Standard<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Q1 (7N65)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Diode<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Schottky<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">D2 (SR540)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Capacitor<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">220&nbsp;µF<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">C6<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Resistor (Last)<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">12&nbsp;Ω<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Verbraucher<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">A/C (Sawtooth)<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">65&nbsp;kHz, 0–5&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Oszillator<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">Op-Amp + RC<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">100k / 1nF<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px; border-bottom:1px solid #d8dde2;\">TL431<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 8px;\">R8 / R9<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;\">38&nbsp;k / 10&nbsp;k<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;\">Sollwert-Teiler<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div>\n      <h3 style=\"font-size:15px; font-weight:700; margin:6px 0 6px; color:#BB4400;\">⚠ Stolpersteine<\u002Fh3>\n      <ul style=\"margin:0 0 12px; padding-left:16px; font-size:11.5px; line-height:1.55; color:#444;\">\n        <li style=\"margin-bottom:4px;\"><b>Time step vergessen<\u002Fb> → 65&nbsp;kHz nicht aufgelöst, Konvergenzfehler. Immer ~1e-7 setzen.<\u002Fli>\n        <li style=\"margin-bottom:4px;\"><b>Trafo-Kopplung 0,99<\u002Fb>, nicht 1,0 — kleine Streuung erzeugt die realistische Drain-Spitze.<\u002Fli>\n        <li style=\"margin-bottom:4px;\"><b>Falsche Dot-Orientierung<\u002Fb> → Diode leitet zur falschen Zeit → Sekundäranschlüsse tauschen.<\u002Fli>\n        <li style=\"margin-bottom:4px;\"><b>Vorzeichen der Regelung<\u002Fb> falsch → U<sub>out<\u002Fsub> läuft weg → Op-Amp-Eingänge tauschen.<\u002Fli>\n        <li><b>Op-Amp schwingt<\u002Fb> → RC-Kompensation (Cf) vergrößern.<\u002Fli>\n      <\u002Ful>\n      <h3 style=\"font-size:15px; font-weight:700; margin:6px 0 6px;\">🚀 Ausbaustufen<\u002Fh3>\n      <ul style=\"margin:0; padding-left:16px; font-size:11.5px; line-height:1.55; color:#444;\">\n        <li style=\"margin-bottom:4px;\">Echter Netzeingang: A/C 325&nbsp;V/50&nbsp;Hz + Brücke + 47&nbsp;µF.<\u002Fli>\n        <li style=\"margin-bottom:4px;\">Snubber: RCD-Glied über der Primärwicklung.<\u002Fli>\n        <li>Echte Trennung: Opto nachbilden, Fehlerverstärker auf zweite Masse.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===================== TEIL 4 REFERENZ ===================== -->\n  <div style=\"break-before:page;\"><\u002Fdiv>\n  <div style=\"display:flex; align-items:center; gap:14px; margin-top:6px; padding-bottom:8px; border-bottom:2px solid #333;\">\n    <span style=\"font-size:40px; font-weight:800; color:#7EC8E8; line-height:1;\">04<\u002Fspan>\n    <div>\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#888;\">Teil 4 · Referenz<\u002Fdiv>\n      <h2 style=\"font-size:24px; font-weight:800; margin:2px 0 0;\">Bauteilliste &amp; Kernaussagen<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:18px 0 8px;\">Bauteilliste<\u002Fh3>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:18px;\">\n    <sc-raw-thead><sc-raw-tr style=\"background:#333; color:#fff;\"><sc-raw-th style=\"text-align:left; padding:6px 9px;\">Bauteil<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left; padding:6px 9px;\">Wert / Typ<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left; padding:6px 9px;\">Funktion<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">F1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">3&nbsp;A<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Netzsicherung<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">NTC<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Thermistor<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Einschaltstrombegrenzung<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">C1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">4,7&nbsp;µF / 400&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Eingangs-/Entstörkondensator<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">BR1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">4&nbsp;A / 600&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Brückengleichrichter<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">C2<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">47&nbsp;µF / 400&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Zwischenkreis-Elko (~325&nbsp;V)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">R1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">100&nbsp;k<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Anlaufwiderstand<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">D1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">1N4007<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Gleichrichter Hilfswicklung (VCC)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">C3<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">10&nbsp;µF / 50&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">VCC-Stützkondensator<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">U1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">OB2263<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Strommodus-PWM-Controller<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">Q1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">7N65<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Leistungs-MOSFET (650&nbsp;V / ~7&nbsp;A)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">R2<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">10&nbsp;Ω<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Strom-Messwiderstand (CS)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">T1<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">EE16<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Sperrwandler-Trafo (Speicher + Trennung)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">D2<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">SR540<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Schottky-Sekundärgleichrichter (5&nbsp;A / 40&nbsp;V)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">C6<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">2200&nbsp;µF / 25&nbsp;V<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Ausgangs-Elko<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">U3<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">TL431<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Präzisionsreferenz / Fehlerverstärker<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#f6f8f9;\"><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2; font-weight:700;\">U2<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">PC817<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px; border-bottom:1px solid #d8dde2;\">Optokoppler (isolierte Rückmeldung)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"background:#fff;\"><sc-raw-td style=\"padding:5px 9px; font-weight:700;\">R8 / R9<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px;\">2,2&nbsp;k / 1&nbsp;k<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 9px;\">Spannungsteiler (Sollwert)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:6px 0 10px;\">Die wichtigsten Kernaussagen<\u002Fh3>\n  <div style=\"display:flex; flex-direction:column; gap:8px; margin-bottom:18px;\">\n    <div class=\"callout\" style=\"background:#f5f8fa; border-left:4px solid #7EC8E8; border-radius:0 4px 4px 0; padding:10px 14px; font-size:12.5px; line-height:1.55; color:#333;\"><b>Zwei getrennte Welten:<\u002Fb> Der Trafo überträgt die Energie isoliert, der Optokoppler die Information — zusammen schließen sie den Regelkreis über die Sicherheitsgrenze.<\u002Fdiv>\n    <div class=\"callout\" style=\"background:#f5f8fa; border-left:4px solid #7EC8E8; border-radius:0 4px 4px 0; padding:10px 14px; font-size:12.5px; line-height:1.55; color:#333;\"><b>Strommodus-Regelung:<\u002Fb> Der OB2263 regelt Takt für Takt den Spitzenstrom; die 12&nbsp;V werden sekundär mit TL431 gemessen und per Opto zurückgemeldet.<\u002Fdiv>\n    <div class=\"callout\" style=\"background:#f5f8fa; border-left:4px solid #7EC8E8; border-radius:0 4px 4px 0; padding:10px 14px; font-size:12.5px; line-height:1.55; color:#333;\"><b>Der „Trafo\" ist ein Speicher:<\u002Fb> Energie wird im Luftspalt zwischengelagert (Speichern/Abgeben), nicht direkt durchgereicht.<\u002Fdiv>\n    <div class=\"callout\" style=\"background:#ffecec; border-left:4px solid #CC0000; border-radius:0 4px 4px 0; padding:10px 14px; font-size:12.5px; line-height:1.55; color:#3a1a1a;\"><b>Sicherheit:<\u002Fb> Primärseite führt Netzpotential; unter Spannung nur mit Trenntrafo und Differenztastkopf. Ohne Rückkopplung droht Überspannung.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:16px; font-weight:700; margin:6px 0 8px;\">Empfohlener Lernpfad<\u002Fh3>\n  <ol style=\"margin:0 0 18px; padding-left:20px; font-size:13px; line-height:1.7; color:#333;\">\n    <li>Zuerst <b>Teil&nbsp;1 (Verstehen)<\u002Fb> lesen — das Prinzip verinnerlichen.<\u002Fli>\n    <li>Dann die interaktive Simulation öffnen und am Modell „spielen\", bis das Regelverhalten sitzt.<\u002Fli>\n    <li>Optional <b>Teil&nbsp;3 (Simulieren)<\u002Fb> — die Schaltung selbst im Browser nachbauen.<\u002Fli>\n    <li>Bei Reparatur/Defekt <b>Teil&nbsp;2 (Prüfen)<\u002Fb> — nach dem Sicherheits-Ablauf messen.<\u002Fli>\n  <\u002Fol>\n\n  <!-- ===================== ANHANG: Vollständiger Schaltplan ===================== -->\n  <div style=\"break-before:page;\"><\u002Fdiv>\n  <div style=\"display:flex; align-items:center; gap:14px; margin-top:6px; padding-bottom:8px; border-bottom:2px solid #333;\">\n    <span style=\"font-size:40px; font-weight:800; color:#7EC8E8; line-height:1;\">A<\u002Fspan>\n    <div>\n      <div style=\"font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#888;\">Anhang<\u002Fdiv>\n      <h2 style=\"font-size:24px; font-weight:800; margin:2px 0 0;\">Vollständiger Schaltplan<\u002Fh2>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <figure class=\"callout\" style=\"margin:22px 0 0;\">\n    <img src=\"3a7034da-befd-477f-8941-0299705fdb2d\" alt=\"Vollständiger Schaltplan — PWM Controlled SMPS\" style=\"width:100%; height:auto; border:1px solid #C0C0C0; border-radius:4px; display:block;\">\n    <figcaption style=\"font-size:12px; color:#666; margin-top:10px; line-height:1.55;\"><b>Referenz-Schaltbild · PWM Controlled SMPS.<\u002Fb> Kompletter Sperrwandler von AC&nbsp;IN über Brückengleichrichter (W10G), Zwischenkreis (C1/C2) und PWM-Controller U1 (GND/FB/RT · GATE/VDD/CS) mit MOSFET Q1, bis zum Trafo T1, der sekundären Gleichrichtung (D4, C5) am +12-V-Ausgang und der isolierten Regelung aus TL431 (U2) und Optokoppler PC817. GND&nbsp;P (Primärmasse) und GND&nbsp;S (Sekundärmasse) sind getrennt.<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <div style=\"display:flex; align-items:center; gap:12px; margin-top:26px; padding-top:14px; border-top:1px solid #C0C0C0;\">\n    <img src=\"3e8e68bc-310d-493e-8bb5-2fca740d5851\" alt=\"RwTec\" style=\"width:34px; height:34px; border-radius:50%;\">\n    <p style=\"margin:0; font-size:10.5px; line-height:1.5; color:#999;\">OB2263-Sperrwandler · Gesamtheft · Verstehen → Prüfen → Simulieren<br>Erstellt 2026-07-11 · RwTec Werkstattbericht<\u002Fp>\n  <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fx-import>\n\n\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
