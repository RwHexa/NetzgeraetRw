<svg role="img" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <title>Vereinfachter vs. vollstaendiger Schaltplan</title>
  <desc>Gegenueberstellung: Im vereinfachten Schaltplan fehlt die Rueckmeldeleitung vom Optokoppler zum FB-Pin (rot, fehlt), im vollstaendigen Referenzplan ist sie gezeichnet (gruen). Zusaetzlich fehlen links RT-Widerstand, Primaer-Snubber und getrennte Massen.</desc>
  <style>
    :root{--p:#1c1c1c;--s:#5a5f66;--t:#4a4f55;--b:#c2c6cc;}
    .ts{font-size:12px;fill:var(--s);} .th{font-size:13px;font-weight:600;fill:var(--p);}
    .arr{stroke:var(--t);stroke-width:1.5;fill:none;}
    .c-gray>rect{fill:#eceae3;stroke:#9aa0a6;stroke-width:1.1;} .c-gray .th{fill:#33383f;}
    .c-amber>rect{fill:#FAEEDA;stroke:#BA7517;stroke-width:1.2;} .c-amber .th{fill:#633806;}
    .c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1.2;} .c-teal .th{fill:#085041;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1c1c1c">Vereinfacht &#8596; vollständig — der Rückkopplungsweg</text>
  <line x1="380" y1="50" x2="380" y2="405" stroke="var(--b)" stroke-width="1" stroke-dasharray="4 5"/>

  <g class="c-amber"><rect x="30" y="58" width="320" height="38" rx="8"/>
    <text class="th" x="190" y="77" text-anchor="middle" dominant-baseline="central">Vereinfacht (Schaltplan.jpg)</text></g>
  <g class="c-teal"><rect x="410" y="58" width="320" height="38" rx="8"/>
    <text class="th" x="570" y="77" text-anchor="middle" dominant-baseline="central">Vollständig (Referenzplan)</text></g>

  <g class="c-gray"><rect x="40" y="112" width="86" height="48" rx="7"/><text class="th" x="83" y="136" text-anchor="middle" dominant-baseline="central">U1 · FB</text></g>
  <g class="c-gray"><rect x="170" y="112" width="80" height="48" rx="7"/><text class="th" x="210" y="136" text-anchor="middle" dominant-baseline="central">PC817</text></g>
  <g class="c-gray"><rect x="272" y="112" width="86" height="48" rx="7"/><text class="th" x="315" y="136" text-anchor="middle" dominant-baseline="central">TL431</text></g>
  <line class="arr" x1="272" y1="136" x2="252" y2="136" marker-end="url(#arrow)"/>
  <line x1="170" y1="136" x2="153" y2="136" stroke="#d1495b" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="143" y1="136" x2="128" y2="136" stroke="#d1495b" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="148" y="141" text-anchor="middle" font-size="15" fill="#d1495b">&#10007;</text>
  <text class="ts" x="148" y="106" text-anchor="middle" fill="#d1495b">fehlt im Plan</text>

  <g class="c-gray"><rect x="420" y="112" width="86" height="48" rx="7"/><text class="th" x="463" y="136" text-anchor="middle" dominant-baseline="central">U1 · FB</text></g>
  <g class="c-gray"><rect x="550" y="112" width="80" height="48" rx="7"/><text class="th" x="590" y="136" text-anchor="middle" dominant-baseline="central">PC817</text></g>
  <g class="c-gray"><rect x="652" y="112" width="86" height="48" rx="7"/><text class="th" x="695" y="136" text-anchor="middle" dominant-baseline="central">TL431</text></g>
  <line class="arr" x1="652" y1="136" x2="632" y2="136" marker-end="url(#arrow)"/>
  <line x1="550" y1="136" x2="508" y2="136" stroke="#2e7d46" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="529" y="141" text-anchor="middle" font-size="14" fill="#2e7d46">&#10003;</text>
  <text class="ts" x="529" y="106" text-anchor="middle" fill="#2e7d46">gezeichnet</text>

  <text class="ts" x="200" y="182" text-anchor="middle" fill="var(--s)">Rückmeldeweg: TL431 &#8594; Opto &#8594; FB-Pin</text>
  <text class="ts" x="580" y="182" text-anchor="middle" fill="var(--s)">Rückmeldeweg: TL431 &#8594; Opto &#8594; FB-Pin</text>

  <g font-size="13" fill="#d1495b"><text x="42" y="216">&#10007;</text><text x="42" y="244">&#10007;</text><text x="42" y="272">&#10007;</text><text x="42" y="300">&#10007;</text></g>
  <g class="ts" fill="var(--p)">
    <text x="62" y="216">FB-Rückleitung (Opto &#8594; Pin 2)</text>
    <text x="62" y="244">RT-Widerstand R5</text>
    <text x="62" y="272">Primär-Snubber (RCD)</text>
    <text x="62" y="300">getrennte Massen GND P/S</text>
  </g>
  <g font-size="13" fill="#2e7d46"><text x="422" y="216">&#10003;</text><text x="422" y="244">&#10003;</text><text x="422" y="272">&#10003;</text><text x="422" y="300">&#10003;</text></g>
  <g class="ts" fill="var(--p)">
    <text x="442" y="216">FB-Rückleitung (Opto &#8594; Pin 2)</text>
    <text x="442" y="244">RT-Widerstand R5</text>
    <text x="442" y="272">Primär-Snubber R3/R4/C6/D2</text>
    <text x="442" y="300">GND P / GND S</text>
  </g>

  <text class="ts" x="380" y="422" text-anchor="middle" fill="var(--s)">Beide zeigen dasselbe Netzteil — nur die vollständige Version zeichnet die Opto-Rückmeldung zum FB-Pin ein.</text>
</svg>
