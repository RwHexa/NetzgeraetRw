<svg role="img" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <title>Regelschleife des OB2263-Sperrwandlers</title>
  <desc>Geschlossener Regelkreis: OB2263 steuert Q1 und Trafo (Leistungsfluss); der 12-V-Ausgang wird uber R8/R9, TL431 und Optokoppler PC817 an den FB-Pin zuruckgemeldet. Trafo und Optokoppler uberbrucken die galvanische Trennung.</desc>
  <style>
    :root{--p:#1c1c1c;--s:#5a5f66;--t:#4a4f55;--b:#c2c6cc;}
    .t{font-size:14px;fill:var(--p);} .ts{font-size:12px;fill:var(--s);}
    .th{font-size:14px;font-weight:600;fill:var(--p);}
    .arr{stroke:var(--t);stroke-width:1.5;fill:none;}
    .c-amber>rect,rect.c-amber{fill:#fbe7cf;stroke:#d38b1f;stroke-width:1.2;}
    .c-amber .th{fill:#7a4a09;} .c-amber .ts{fill:#8a5a1a;}
    .c-blue>rect,rect.c-blue{fill:#dce9fb;stroke:#3a78cc;stroke-width:1.2;}
    .c-blue .th{fill:#17395f;} .c-blue .ts{fill:#2a4f7a;}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="700" height="400" fill="#ffffff"/>

  <line x1="345" y1="30" x2="345" y2="386" stroke="var(--b)" stroke-width="1" stroke-dasharray="4 5"/>
  <text class="ts" x="353" y="178">Galvanische</text>
  <text class="ts" x="353" y="193">Trennung</text>

  <rect x="22" y="30" width="14" height="10" rx="2" class="c-amber"/>
  <text class="ts" x="42" y="35" dominant-baseline="central">Leistungsfluss</text>
  <rect x="150" y="30" width="14" height="10" rx="2" class="c-blue"/>
  <text class="ts" x="170" y="35" dominant-baseline="central">Regel-/Ruckkopplungspfad</text>

  <g class="c-blue">
    <rect x="22" y="54" width="120" height="60" rx="8"/>
    <text class="th" x="82" y="78" text-anchor="middle" dominant-baseline="central">OB2263</text>
    <text class="ts" x="82" y="96" text-anchor="middle" dominant-baseline="central">Strommodus-PWM</text>
  </g>
  <g class="c-amber">
    <rect x="170" y="54" width="96" height="60" rx="8"/>
    <text class="th" x="218" y="78" text-anchor="middle" dominant-baseline="central">Q1 · 7N65</text>
    <text class="ts" x="218" y="96" text-anchor="middle" dominant-baseline="central">Schalter</text>
  </g>
  <g class="c-amber">
    <rect x="293" y="54" width="104" height="60" rx="8"/>
    <text class="th" x="345" y="78" text-anchor="middle" dominant-baseline="central">T1 Trafo</text>
    <text class="ts" x="345" y="96" text-anchor="middle" dominant-baseline="central">EE16-Kern</text>
  </g>
  <g class="c-amber">
    <rect x="430" y="54" width="118" height="60" rx="8"/>
    <text class="th" x="489" y="78" text-anchor="middle" dominant-baseline="central">D2 · C6</text>
    <text class="ts" x="489" y="96" text-anchor="middle" dominant-baseline="central">Gleichrichtung</text>
  </g>
  <g class="c-amber">
    <rect x="584" y="54" width="94" height="60" rx="8"/>
    <text class="th" x="631" y="78" text-anchor="middle" dominant-baseline="central">+12 V OUT</text>
    <text class="ts" x="631" y="96" text-anchor="middle" dominant-baseline="central">Ausgang</text>
  </g>

  <g class="c-blue">
    <rect x="584" y="270" width="94" height="60" rx="8"/>
    <text class="th" x="631" y="294" text-anchor="middle" dominant-baseline="central">R8 / R9</text>
    <text class="ts" x="631" y="312" text-anchor="middle" dominant-baseline="central">Teiler</text>
  </g>
  <g class="c-blue">
    <rect x="430" y="270" width="118" height="60" rx="8"/>
    <text class="th" x="489" y="294" text-anchor="middle" dominant-baseline="central">TL431</text>
    <text class="ts" x="489" y="312" text-anchor="middle" dominant-baseline="central">2,5 V-Referenz</text>
  </g>
  <g class="c-blue">
    <rect x="293" y="270" width="104" height="60" rx="8"/>
    <text class="th" x="345" y="294" text-anchor="middle" dominant-baseline="central">PC817</text>
    <text class="ts" x="345" y="312" text-anchor="middle" dominant-baseline="central">Optokoppler</text>
  </g>

  <line class="arr" x1="142" y1="84" x2="167" y2="84" marker-end="url(#arrow)"/>
  <line class="arr" x1="266" y1="84" x2="291" y2="84" marker-end="url(#arrow)"/>
  <line class="arr" x1="397" y1="84" x2="428" y2="84" marker-end="url(#arrow)"/>
  <line class="arr" x1="548" y1="84" x2="582" y2="84" marker-end="url(#arrow)"/>
  <line class="arr" x1="631" y1="114" x2="631" y2="268" marker-end="url(#arrow)"/>
  <line class="arr" x1="584" y1="300" x2="550" y2="300" marker-end="url(#arrow)"/>
  <line class="arr" x1="430" y1="300" x2="399" y2="300" marker-end="url(#arrow)"/>
  <path d="M293 300 L82 300 L82 116" fill="none" stroke="var(--t)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="92" y="205">FB · Pin 2</text>
  <text class="ts" x="92" y="221">&#8594; Duty-Cycle &#8595;</text>

  <text class="ts" x="22" y="384">Primarseite · ~325 V DC (Netzbezug)</text>
  <text class="ts" x="678" y="384" text-anchor="end">Sekundarseite · 12 V (beruhrsicher)</text>
</svg>
